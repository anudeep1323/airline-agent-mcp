# Runs on every push and pull request, and on demand from the Actions tab ("Run workflow").
#   job 1 "tests": pytest with a fake Claude: free, no secrets, ~1 min
#   job 2 "evals": the real agent against agent_evals.json, only if job 1 passed; needs the
#                  ANTHROPIC_API_KEY repository secret (skipped with a notice until it exists), ~$0.23 per run
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - run: python -m pip install -r requirements-agent.txt
      - run: python -m pytest -v

  evals:
    needs: tests                                    # don't spend money on a build whose code tests already fail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # GitHub masks it in logs; never printed
    steps:
      - name: Skip if no API key secret is set
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set, skipping real-Claude evals"
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - run: python -m pip install -r requirements-agent.txt
        if: env.ANTHROPIC_API_KEY != ''
      - run: python agent_eval.py --min-score 0.9   # red build if fewer than 90% of cases pass
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/upload-artifact@v4            # keep the run's answers + scores to read later
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-results
          path: eval_results/run-*.json

  docker:
    needs: [tests, evals]                           # only package code that passed every check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write                               # lets GITHUB_TOKEN publish to ghcr.io (no extra secret)
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t airline-agent:ci .
      - name: Smoke test, start it like production would and poke it
        run: |
          docker run -d --name api -p 8000:8000 -e JWT_SECRET="$(openssl rand -hex 32)" airline-agent:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 1; done
          echo; curl -sf localhost:8000/ready | grep -q '"cancel_booking"'            # MCP child started inside the container
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/bookings/ABC123)" = 401   # auth is on
          # production by default: the dev password that is public in this repo must NOT work
          PW=$(docker exec api python -c "import airline_server as s; print(s.DEV_USERS[0][3])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
                -d "{\"username\":\"andy\",\"password\":\"$PW\"}" localhost:8000/v1/login)" = 401
          docker image ls airline-agent:ci --format 'image size: {{.Size}}'
      - name: Show container logs if anything failed
        if: failure()
        run: docker logs api
      - name: Publish to GitHub Container Registry (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag airline-agent:ci $IMAGE:latest
          docker tag airline-agent:ci $IMAGE:${{ github.sha }}            # every commit gets its own, never-overwritten tag
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
